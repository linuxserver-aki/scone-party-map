<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>スコーンパーティー 会場マップ</title>
<style>
  :root{
    --bg:#faf7f2; --panel:#ffffff; --ink:#22201d; --muted:#7a746c;
    --line:#e6e0d6; --accent:#b4571f; --accent-soft:#f7e9dc; --ok:#2f7a4f;
    --shadow:0 6px 24px rgba(40,30,20,.16);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#16151a; --panel:#211f26; --ink:#f1ede7; --muted:#a49e96;
      --line:#37333d; --accent:#e08a4c; --accent-soft:#3b2a1d; --ok:#63c08c;
      --shadow:0 6px 24px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#16151a; --panel:#211f26; --ink:#f1ede7; --muted:#a49e96;
    --line:#37333d; --accent:#e08a4c; --accent-soft:#3b2a1d; --ok:#63c08c;
    --shadow:0 6px 24px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--ink); overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    font-size:15px; line-height:1.55; -webkit-text-size-adjust:100%;
    display:flex; flex-direction:column;
  }

  header{flex:none;padding:8px 10px 7px;border-bottom:1px solid var(--line);background:var(--panel)}
  .hrow{display:flex;gap:6px;align-items:center}
  .tab{
    flex:1;padding:8px 4px;border:1px solid var(--line);background:transparent;
    color:var(--muted);border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;
  }
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .icb{
    flex:none;width:40px;padding:8px 0;border:1px solid var(--line);background:transparent;
    color:var(--muted);border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;
  }
  .meta{display:flex;justify-content:space-between;align-items:center;margin-top:5px;font-size:11px;color:var(--muted)}

  #vp{flex:1;position:relative;overflow:hidden;background:#fff;touch-action:none}
  #cv{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
  #cv img{display:block;width:100%;height:auto;pointer-events:none;user-select:none}

  .hs{
    position:absolute;transform:translate(-50%,-50%);
    border:0;background:transparent;padding:0;margin:0;cursor:pointer;
    font-family:inherit;z-index:2;
  }
  .hs i{display:none}
  body.showbox .hs{background:rgba(180,87,31,.12);outline:1px dashed rgba(180,87,31,.5)}

  .zoom{position:absolute;right:9px;bottom:9px;display:flex;flex-direction:column;gap:5px;z-index:6}
  .zoom button{
    width:34px;height:34px;border-radius:9px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);font-size:16px;font-weight:700;cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.12);font-family:inherit;line-height:1;
  }

  .scrim{
    position:absolute;inset:0;background:rgba(20,15,10,.35);opacity:0;pointer-events:none;
    transition:opacity .18s;z-index:9;
  }
  .scrim.open{opacity:1;pointer-events:auto}

  .sheet{
    position:absolute;left:0;right:0;bottom:0;z-index:10;
    background:var(--panel);border-top:1px solid var(--line);
    border-radius:16px 16px 0 0;box-shadow:var(--shadow);
    transform:translateY(110%);transition:transform .22s cubic-bezier(.3,.8,.3,1);
    max-height:88%;overflow-y:auto;
    padding:8px 15px calc(15px + env(safe-area-inset-bottom));
    visibility:hidden;
  }
  .sheet.open{transform:translateY(0);visibility:visible}
  .grab{width:36px;height:4px;border-radius:3px;background:var(--line);margin:0 auto 10px}
  .sName{font-size:21px;font-weight:700;line-height:1.3;word-break:break-word}
  .sVenue{display:inline-block;margin-top:5px;font-size:11px;padding:2px 8px;border-radius:5px;background:var(--accent-soft);color:var(--accent);font-weight:700}
  .sItems{margin-top:9px;font-size:15px}
  .sItems b{display:block;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em;margin-bottom:1px}
  .acts{display:flex;flex-direction:column;gap:7px;margin-top:13px}
  .acts a,.acts button{
    display:flex;align-items:center;justify-content:center;gap:6px;
    padding:11px;border-radius:9px;text-decoration:none;font-size:14px;font-weight:700;
    border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;font-family:inherit;
  }
  .acts a.prim{background:var(--accent);border-color:var(--accent);color:#fff}
  .acts button.gone{background:var(--ok);border-color:var(--ok);color:#fff}
  .navr{display:flex;gap:7px;margin-top:9px}
  .navr button{
    flex:1;padding:9px;border-radius:9px;border:1px solid var(--line);
    background:transparent;color:var(--muted);font-size:13px;cursor:pointer;font-family:inherit;
  }

  .panel{
    position:absolute;inset:0;z-index:12;background:var(--bg);
    transform:translateY(100%);transition:transform .22s cubic-bezier(.3,.8,.3,1);
    display:flex;flex-direction:column;visibility:hidden;
  }
  .panel.open{transform:translateY(0);visibility:visible}
  .ph{flex:none;display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
  .ph b{flex:1;font-size:15px}
  .ph button{padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:13px;cursor:pointer;font-family:inherit}
  .pb{flex:1;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom)}
  .grp{padding:9px 13px 4px;font-size:11px;font-weight:700;letter-spacing:.07em;color:var(--muted)}
  .item{display:flex;align-items:center;gap:9px;padding:10px 13px;border-top:1px solid var(--line);cursor:pointer;background:transparent;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;font-family:inherit;color:var(--ink)}
  .item .ii{flex:1;min-width:0}
  .item .in{font-size:15px;font-weight:600;word-break:break-word}
  .item .ic{font-size:12px;color:var(--muted)}
  .item .ig{flex:none;font-size:11px;color:var(--ok);font-weight:700}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <button class="tab" data-v="0" aria-selected="true">為体</button>
    <button class="tab" data-v="1" aria-selected="false">旧宮崎酒造</button>
    <button class="icb" id="bList">一覧</button>
  </div>
  <div class="meta">
    <span id="mHint">店名をタップすると詳細が出ます</span>
    <span id="mCount"></span>
  </div>
</header>

<div id="vp">
  <div id="cv"><img id="mapImg" alt="会場マップ"></div>
  <div class="zoom">
    <button id="zIn" aria-label="拡大">＋</button>
    <button id="zOut" aria-label="縮小">−</button>
    <button id="zFit" aria-label="全体表示" style="font-size:11px">全体</button>
  </div>

  <div class="scrim" id="scrim"></div>

  <div class="sheet" id="sheet">
    <div class="grab"></div>
    <div class="sName" id="sName"></div>
    <span class="sVenue" id="sVenue"></span>
    <div class="sItems"><b>出店するもの</b><span id="sItems"></span></div>
    <div class="acts" id="sActs"></div>
    <div class="navr">
      <button id="sPrev">← 前</button>
      <button id="sClose">閉じる</button>
      <button id="sNext">次 →</button>
    </div>
  </div>

  <div class="panel" id="panel">
    <div class="ph"><b>出店一覧（33店）</b><button id="pClose">閉じる</button></div>
    <div class="pb" id="pBody"></div>
  </div>
</div>

const VN = ["為体","旧宮崎酒造"];
const KEY = "sp_visited_v1";

let vi = 0, cur = -1;
let visited = {};
try{ const r = localStorage.getItem(KEY); if(r) visited = JSON.parse(r) || {}; }catch(e){}
function saveV(){ try{ localStorage.setItem(KEY, JSON.stringify(visited)); }catch(e){} }

const vp = document.getElementById('vp');
const cv = document.getElementById('cv');
const img = document.getElementById('mapImg');
const sheet = document.getElementById('sheet');
const scrim = document.getElementById('scrim');
const panel = document.getElementById('panel');

let scale=1, tx=0, ty=0, baseW=1, baseH=1, minS=1, ar=1;

function inVenue(){
  const out=[];
  SHOPS.forEach((s,i)=>{ if(s.v===vi) out.push({s,i}); });
  return out;
}

function applyT(){
  cv.style.transform = 'translate('+tx+'px,'+ty+'px) scale('+scale+')';
  cv.style.setProperty('--d', Math.max(9, Math.min(26, 15/scale))+'px');
}
function clampT(){
  const w = baseW*scale, h = baseH*scale;
  const vw = vp.clientWidth, vh = vp.clientHeight;
  tx = w <= vw ? (vw-w)/2 : Math.min(0, Math.max(vw-w, tx));
  ty = h <= vh ? (vh-h)/2 : Math.min(0, Math.max(vh-h, ty));
}
function fit(){
  if(!img.naturalWidth) return;
  const vw = vp.clientWidth, vh = vp.clientHeight;
  baseW = vw;
  baseH = vw * img.naturalHeight / img.naturalWidth;
  ar = baseH / baseW;
  cv.style.width = baseW+'px';
  minS = Math.min(1, vh/baseH);
  scale = minS; tx=0; ty=0; clampT(); applyT();
}
function zoomAt(f, cxp, cyp){
  const ns = Math.max(minS, Math.min(6, scale*f));
  const k = ns/scale;
  tx = cxp - k*(cxp - tx);
  ty = cyp - k*(cyp - ty);
  scale = ns; clampT(); applyT();
}

/* --- hotspots: 実DOMボタンなのでブラウザ標準のタップ判定が効く --- */
function buildHotspots(){
  cv.querySelectorAll('.hs').forEach(e=>e.remove());
  const list = inVenue();
  list.forEach(({s,i})=>{
    // 最近傍までの距離から、隣と被らないサイズを決める
    let nn = 1;
    list.forEach(({s:o})=>{
      if(o===s) return;
      const d = Math.hypot(o.x-s.x, (o.y-s.y)*ar);
      if(d<nn) nn=d;
    });
    const r = Math.max(0.035, Math.min(0.085, nn*0.46));
    const b = document.createElement('button');
    b.className = 'hs' + (visited[s.n] ? ' gone' : '');
    b.style.left = (s.x*100)+'%';
    b.style.top  = (s.y*100)+'%';
    b.style.width  = (r*2*100)+'%';
    b.style.height = (r*2*100/ar)+'%';
    b.setAttribute('aria-label', s.n);
    b.dataset.i = i;
    b.appendChild(document.createElement('i'));
    cv.appendChild(b);
  });
  const g = list.filter(o=>visited[o.s.n]).length;
  document.getElementById('mCount').textContent = '行った ' + g + ' / ' + list.length;
}

/* クリックはボタン優先。外れたら最寄りの店を拾う */
vp.addEventListener('click', (e)=>{
  if(dragged){ dragged=false; return; }
  if(e.target.closest('.zoom,.sheet,.panel,.scrim')) return;
  const b = e.target.closest('.hs');
  if(b){ openSheet(+b.dataset.i); return; }
  const r = cv.getBoundingClientRect();
  if(!r.width) return;
  const nx = (e.clientX-r.left)/r.width, ny = (e.clientY-r.top)/r.height;
  if(nx<0||nx>1||ny<0||ny>1) return;
  let best=-1, bd=1e9;
  inVenue().forEach(({s,i})=>{
    const d = Math.hypot(nx-s.x, (ny-s.y)*ar);
    if(d<bd){ bd=d; best=i; }
  });
  if(best>=0 && bd < 0.10) openSheet(best);
});

/* --- pan / pinch : 動き出してから初めて指を固定する --- */
const pts = new Map();
let dragging=false, dragged=false, moved=0, startD=0, startS=1, startC=null;

vp.addEventListener('pointerdown', e=>{
  if(e.target.closest('.zoom,.sheet,.panel,.scrim')) return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1){ moved=0; dragging=false; dragged=false; }
  if(pts.size===2){
    const a=[...pts.values()];
    startD = Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y);
    startS = scale;
    const r = vp.getBoundingClientRect();
    startC = {x:(a[0].x+a[1].x)/2 - r.left, y:(a[0].y+a[1].y)/2 - r.top};
    dragging = true; dragged = true;
    try{ vp.setPointerCapture(e.pointerId); }catch(err){}
  }
});
vp.addEventListener('pointermove', e=>{
  if(!pts.has(e.pointerId)) return;
  const prev = pts.get(e.pointerId);
  const dx = e.clientX-prev.x, dy = e.clientY-prev.y;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});

  if(pts.size===2 && startD){
    const a=[...pts.values()];
    const d = Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y);
    const ns = Math.max(minS, Math.min(6, startS * d/startD));
    const k = ns/scale;
    tx = startC.x - k*(startC.x - tx);
    ty = startC.y - k*(startC.y - ty);
    scale = ns; clampT(); applyT();
    return;
  }
  if(pts.size===1){
    moved += Math.hypot(dx,dy);
    if(!dragging && moved > 10){
      dragging = true; dragged = true;
      try{ vp.setPointerCapture(e.pointerId); }catch(err){}
    }
    if(dragging){ tx += dx; ty += dy; clampT(); applyT(); }
  }
});
function endPtr(e){
  pts.delete(e.pointerId);
  if(pts.size<2) startD=0;
  if(pts.size===0) dragging=false;
}
vp.addEventListener('pointerup', endPtr);
vp.addEventListener('pointercancel', endPtr);

/* ダブルタップ拡大 */
let lastTap=0;
vp.addEventListener('pointerup', e=>{
  if(dragged) return;
  if(e.target.closest('.zoom,.sheet,.panel,.scrim')) return;
  const now = Date.now();
  if(now-lastTap < 300){
    const r = vp.getBoundingClientRect();
    zoomAt(scale > minS*1.6 ? minS/scale : 2.2, e.clientX-r.left, e.clientY-r.top);
    lastTap = 0;
  } else lastTap = now;
});

/* --- sheet --- */
function openSheet(i){
  cur = i; const s = SHOPS[i];
  document.getElementById('sName').textContent = s.n;
  document.getElementById('sVenue').textContent = VN[s.v];
  document.getElementById('sItems').textContent = s.it || '—';
  const acts = document.getElementById('sActs');
  acts.innerHTML = '';
  const gb = document.createElement('button');
  gb.textContent = visited[s.n] ? '✓ 行った' : '行ったらタップ';
  if(visited[s.n]) gb.className = 'gone';
  gb.onclick = ()=>{
    if(visited[s.n]) delete visited[s.n]; else visited[s.n]=1;
    saveV(); buildHotspots(); buildList(); openSheet(i);
  };
  acts.appendChild(gb);
  const mk = (t, href, prim)=>{
    const a = document.createElement('a');
    a.textContent = t; a.href = href; a.target='_blank'; a.rel='noopener';
    if(prim) a.className='prim';
    acts.appendChild(a);
  };
  mk('★ Notionで評価する', s.u, true);
  if(s.ig) mk('Instagram @' + s.ig, 'https://www.instagram.com/' + s.ig + '/');
  if(s.p)  mk('イベントの紹介投稿を見る', s.p);
  sheet.classList.add('open'); scrim.classList.add('open');
}
function closeSheet(){ sheet.classList.remove('open'); scrim.classList.remove('open'); cur=-1; }
scrim.addEventListener('click', closeSheet);
document.getElementById('sClose').onclick = closeSheet;
function step(dir){
  const list = inVenue().map(o=>o.i);
  const k = list.indexOf(cur); if(k<0) return;
  openSheet(list[(k+dir+list.length)%list.length]);
}
document.getElementById('sPrev').onclick = ()=>step(-1);
document.getElementById('sNext').onclick = ()=>step(1);

/* --- list --- */
function buildList(){
  const b = document.getElementById('pBody'); b.innerHTML='';
  [0,1].forEach(v=>{
    const g = document.createElement('div');
    g.className='grp'; g.textContent = VN[v];
    b.appendChild(g);
    SHOPS.forEach((s,i)=>{
      if(s.v!==v) return;
      const el = document.createElement('button');
      el.className='item';
      el.innerHTML = '<span class="ii"><span class="in"></span><span class="ic"></span></span><span class="ig"></span>';
      el.querySelector('.in').textContent = s.n;
      el.querySelector('.ic').textContent = s.it || '';
      el.querySelector('.ig').textContent = visited[s.n] ? '✓' : '';
      el.onclick = ()=>{
        panel.classList.remove('open');
        if(vi!==s.v){ switchV(s.v); setTimeout(()=>focusOn(i), 150); }
        else focusOn(i);
      };
      b.appendChild(el);
    });
  });
}
function focusOn(i){
  const s = SHOPS[i];
  scale = Math.max(minS, 2.0);
  tx = vp.clientWidth/2 - s.x*baseW*scale;
  ty = vp.clientHeight/2 - s.y*baseH*scale;
  clampT(); applyT();
  openSheet(i);
}
document.getElementById('bList').onclick = ()=>{ buildList(); panel.classList.add('open'); };
document.getElementById('pClose').onclick = ()=>panel.classList.remove('open');

/* --- venue --- */
function switchV(n){
  vi = n; closeSheet();
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected', String(+t.dataset.v===vi)));
  if(img.getAttribute('src') !== IMGS[vi]) img.src = IMGS[vi];
  else { fit(); buildHotspots(); }
}
img.addEventListener('load', ()=>{ fit(); buildHotspots(); });

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>switchV(+t.dataset.v));
document.getElementById('zIn').onclick  = ()=>zoomAt(1.5, vp.clientWidth/2, vp.clientHeight/2);
document.getElementById('zOut').onclick = ()=>zoomAt(1/1.5, vp.clientWidth/2, vp.clientHeight/2);
document.getElementById('zFit').onclick = ()=>fit();
window.addEventListener('resize', ()=>{ fit(); buildHotspots(); });

/* 判定範囲を見たいとき用（ヘッダーの文言を長押し） */
let lp;
document.getElementById('mHint').addEventListener('pointerdown', ()=>{
  lp = setTimeout(()=>document.body.classList.toggle('showbox'), 700);
});
['pointerup','pointerleave','pointercancel'].forEach(ev=>
  document.getElementById('mHint').addEventListener(ev, ()=>clearTimeout(lp)));

switchV(0);
</script>
